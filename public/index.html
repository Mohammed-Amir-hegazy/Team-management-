<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ابتكار — منصة إدارة الأعمال</title>
  <meta name="description" content="منصة ابتكار لإدارة المشاريع والمهام والتقارير داخل الشركة">
  <meta name="theme-color" content="#06044B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ابتكار">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/ebtikar.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Applied before the first paint so the page never flashes in the wrong theme (see js/theme.js).
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <svg class="mark animate" viewBox="12 2 56 96"><path class="mark-arc" d="M60 4A46 46 0 0 0 60 96V78A28 28 0 0 1 60 22Z"/><path class="mark-arrow" d="M34 50 66 33 58 50 66 67Z"/></svg>
    <img src="/brand/wordmark-white.svg" alt="">
  </div>

  <div id="auth" class="auth hidden"></div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <a class="side-brand" href="#/dashboard" aria-label="ابتكار — الرئيسية">
        <svg class="mark" viewBox="12 2 56 96"><path class="mark-arc" d="M60 4A46 46 0 0 0 60 96V78A28 28 0 0 1 60 22Z"/><path class="mark-arrow" d="M34 50 66 33 58 50 66 67Z"/></svg>
        <img src="/brand/wordmark-white.svg" alt="EBTIKAR">
      </a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-user" id="side-user" role="button" tabindex="0"></div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <svg class="mark mobile-brand" viewBox="12 2 56 96"><path class="mark-arc" d="M60 4A46 46 0 0 0 60 96V78A28 28 0 0 1 60 22Z"/><path class="mark-arrow" d="M34 50 66 33 58 50 66 67Z"/></svg>
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-actions">
          <a href="#/notifications" class="icon-btn" id="bell" aria-label="الإشعارات"></a>
        </div>
      </header>
      <div id="sub-banner"></div>
      <main id="view" class="view"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
    <button class="fab hidden" id="fab" aria-label="إضافة"></button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="print-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
